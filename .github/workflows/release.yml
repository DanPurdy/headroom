name: Release

# Publishes Headroom-<version>.zip as a GitHub release. Either:
#   - Actions → Release → Run workflow on main, entering a version like 0.1.0, or
#   - push a tag like v0.1.0.
#
# Signing and notarisation are optional. Without these secrets the app is ad-hoc signed:
# it works, but a browser download is quarantined and macOS asks the user to approve it
# (scripts/install.sh avoids that). With them, it opens without any prompt.
#   MACOS_CERTIFICATE_P12   base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Jane Doe (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v0.1.0 on main)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Repo code runs in Test and Build; keep the write token out of .git/config.
          persist-credentials: false

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Run releases from main"; exit 1; }
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version: $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Test
        run: scripts/test.sh

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build
        env:
          SIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Notarise
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          zip="dist/Headroom-$VERSION.zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple dist/Headroom.app
          rm "$zip" && ditto -c -k --keepParent dist/Headroom.app "$zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Creates the tag on the commit that was built.
            gh release create "$TAG" dist/Headroom-*.zip --generate-notes --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/Headroom-*.zip --generate-notes --verify-tag
          fi
